animations {
    enabled = yes

    # ТОЛЬКО 3 КРИТИЧЕСКИ ВАЖНЫХ КРИВЫХ
    bezier = easeOutQuad, 0.25, 0.46, 0.45, 0.94  # Оптимальный баланс скорости/плавности
    bezier = easeInQuad, 0.55, 0.085, 0.68, 0.53   # Для закрытия окон (быстрое начало)
    bezier = linear, 0, 0, 1, 1                    # Для критических операций

    # ФУНКЦИОНАЛЬНЫЙ МИНИМУМ (8 анимаций вместо 21)
    animation = global,        1, 1, easeOutQuad    # Базовая скорость для всего
    animation = windowsIn,     1, 2, easeOutQuad, popin 85%  # Быстрое открытие с контекстом
    animation = windowsOut,    1, 1, easeInQuad, popin 85%   # Мгновенное закрытие
    animation = border,        1, 1, linear         # Мгновенная смена цвета рамки при фокусе
    animation = fade,          1, 1, linear         # Минимальное затемнение неактивных окон
    animation = workspaces,    1, 3, easeOutQuad, slidefade 10%  # Пространственная ориентация
    animation = layersIn,      1, 1, easeOutQuad, fade  # Быстрое появление уведомлений
    animation = layersOut,     1, 1, easeInQuad, fade   # Мгновенное исчезание
}
